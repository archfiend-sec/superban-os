version: '3.8'

services:
  superban-os:
    build: .
    container_name: superban-mission-control
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - HEADLESS=1
      - DOCKER=1
    volumes:
      # Persistent storage for sessions and local SQLite forensic intelligence
      - superban_sessions:/app/sessions
      - superban_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  superban_sessions:
  superban_data:
